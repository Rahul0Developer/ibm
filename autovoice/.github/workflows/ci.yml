name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install core + dev dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check src tests scripts
      - name: Tests (pytest)
        run: uv run pytest
