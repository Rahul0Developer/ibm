# Go API Gateway deployment: CPU-only pods, no GPU resources requested.
# Talks to Triton over the in-cluster gRPC service (ml-serving/triton-serving:8001).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: ml-serving
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: your-registry/inference-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: TRITON_GRPC_ADDR
              value: "triton-serving.ml-serving.svc.cluster.local:8001"
            - name: TRITON_MODEL_NAME
              value: "text_embeddings"
            - name: REQUEST_DEADLINE_MS
              value: "25"
            - name: MAX_CONCURRENT_REQUESTS
              value: "512"
            - name: GRPC_POOL_SIZE
              value: "4"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: ml-serving
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
